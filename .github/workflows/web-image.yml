# Builds the web app's container image (web/Dockerfile) and publishes it to GitHub Container
# Registry as ghcr.io/alstomli/runpodslsproj-web, tagged `latest` and with the commit SHA.
# Runs on pushes to master that change the web app. It does not run the tests.
name: Web image

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: web-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/alstomli/runpodslsproj-web

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
